name: python-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [experiment]
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pytest python3-tk procps

      - name: Run manager and launcher tests
        run: /usr/bin/python3 -m pytest manager/tests scripts/tests -q
