# 遠隔監視 RViz 用の compose。
#
# コンテナに残しているのは RViz だけ。Autoware の RViz プラグインと map_loader が
# 要るためで、zenoh ブリッジ・joy・manager・操作GUI はホストで動かす (make remote)。
#
# network_mode: host なので、ホスト側のノードとこのコンテナは同じ ROS_DOMAIN_ID 0 で
# 噛み合う。遠隔側は常に 0 で、車両側の domain とは無関係に車両IDで区別する。

services:
  #### 遠隔監視（make rviz VEHICLE=A3）####
  # RVIZ_VEHICLE_ID は make rviz が渡す。指定すると zenoh 経由の /<ID>/... を
  # prefix なしに中継してから RViz を開く（scripts/run_rviz.bash 参照）。
  rviz2:
    image: "aichallenge-remote-rviz"
    pull_policy: never
    network_mode: host
    stop_grace_period: 10s
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /scripts
    environment:
      - HOME=/tmp
      - DISPLAY=${DISPLAY:-}
      - USER=${USER}
      - ROS_DISTRO=humble
      - XAUTHORITY=${XAUTHORITY:-}
      - QT_X11_NO_MITSHM=1
      - TZ=Asia/Tokyo
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ./output:${OUTPUT_ROOT:-/output}
      - ./scripts:/scripts
      - ./shared:/shared
      - ./rviz:/rviz
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    devices:
      - /dev/dri
    command: ["bash", "-lc", "exec /scripts/run_rviz.bash ${RVIZ_VEHICLE_ID:-}"]
